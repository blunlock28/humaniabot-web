<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HumanIA — Chat</title>
  <meta name="description" content="Chat with your HumanIA personality. Free trial — 10 messages.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS (same as index.html) ── */
    :root {
      --bg: #07090F;
      --surface: #0D1018;
      --surface2: #131722;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #E8EBF4;
      --muted: rgba(232,235,244,0.5);
      --faint: rgba(232,235,244,0.25);
      --accent: #7C6FF5;
      --accent2: #9B91F7;
      --accent-bg: rgba(124,111,245,0.1);
      --accent-border: rgba(124,111,245,0.25);
      --green: #4CAF7D;
      --red: #F56565;
      --radius: 12px;
      --radius-lg: 20px;
      --radius-pill: 100px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: rgba(7,9,15,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }
    .nav-logo { font-size: 17px; font-weight: 600; color: var(--text); text-decoration: none; }
    .nav-logo span { color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .msg-counter {
      font-size: 13px; color: var(--muted);
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
    }
    .msg-counter span { color: var(--accent2); font-weight: 500; }
    .upgrade-btn {
      font-size: 13px; font-weight: 500;
      background: var(--accent); color: #fff;
      border: none; padding: 8px 18px;
      border-radius: var(--radius-pill);
      cursor: pointer; text-decoration: none;
      transition: opacity 0.2s;
    }
    .upgrade-btn:hover { opacity: 0.85; }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 0.5px solid var(--border);
    }
    .sidebar-label {
      font-size: 10px; font-weight: 500;
      color: var(--accent); letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 2px;
    }
    .sidebar-title { font-size: 14px; color: var(--muted); }
    .characters-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }
    .characters-list::-webkit-scrollbar { width: 4px; }
    .characters-list::-webkit-scrollbar-track { background: transparent; }
    .characters-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .char-btn {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px;
      background: transparent; border: none;
      border-radius: var(--radius);
      cursor: pointer; text-align: left;
      transition: background 0.15s;
      color: var(--text);
    }
    .char-btn:hover { background: var(--surface2); }
    .char-btn.active {
      background: var(--accent-bg);
      border: 0.5px solid var(--accent-border);
    }
    .char-emoji { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
    .char-info { min-width: 0; }
    .char-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .char-desc { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── CHAT HEADER ── */
    .chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      border-bottom: 0.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-ava {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--accent-bg);
      border: 0.5px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .chat-char-name { font-size: 15px; font-weight: 500; }
    .chat-char-status { font-size: 12px; color: var(--green); }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Welcome state */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; text-align: center; padding: 40px;
    }
    .welcome-emoji { font-size: 48px; margin-bottom: 16px; }
    .welcome-title {
      font-family: 'Fraunces', serif;
      font-size: 24px; font-weight: 400;
      margin-bottom: 8px;
    }
    .welcome-sub { font-size: 14px; color: var(--muted); max-width: 320px; line-height: 1.6; }

    /* Message bubbles */
    .msg { display: flex; gap: 10px; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .msg-user { justify-content: flex-end; }
    .msg-user .bubble {
      background: var(--accent);
      border-radius: 16px; border-top-right-radius: 4px;
      padding: 10px 16px; font-size: 14px; color: #fff;
      max-width: 70%; line-height: 1.55;
    }

    .msg-ai { justify-content: flex-start; }
    .msg-ai .ai-ava {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface2);
      border: 0.5px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-ai .bubble {
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: 16px; border-top-left-radius: 4px;
      padding: 10px 16px; font-size: 14px;
      color: rgba(232,235,244,0.9);
      max-width: 70%; line-height: 1.6;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Limit reached */
    .limit-banner {
      background: rgba(245,101,101,0.08);
      border: 0.5px solid rgba(245,101,101,0.3);
      border-radius: var(--radius);
      padding: 16px 20px;
      text-align: center;
    }
    .limit-banner p { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .limit-banner a {
      display: inline-block;
      background: var(--accent); color: #fff;
      padding: 9px 22px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 500; text-decoration: none;
      transition: opacity 0.2s;
    }
    .limit-banner a:hover { opacity: 0.85; }

    /* ── INPUT ── */
    .input-area {
      padding: 16px 20px;
      border-top: 0.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-box {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface2);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within { border-color: var(--accent-border); }
    #msg-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-family: 'Inter', sans-serif;
      font-size: 14px; resize: none;
      min-height: 22px; max-height: 120px;
      line-height: 1.5;
    }
    #msg-input::placeholder { color: var(--faint); }
    #send-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent); border: none;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
      transition: opacity 0.2s; color: #fff;
      font-size: 15px;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .input-hint {
      font-size: 11px; color: var(--faint);
      text-align: center; margin-top: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .sidebar { width: 60px; }
      .char-info, .sidebar-title, .sidebar-label { display: none; }
      .char-btn { justify-content: center; padding: 10px; }
      .sidebar-header { padding: 12px 8px; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">Human<span>IA</span></a>
  <div class="nav-right">
    <div class="msg-counter">
      Messages: <span id="msg-count">10</span> / 10 free
    </div>
    <a href="index.html#plans" class="upgrade-btn">Upgrade ↗</a>
  </div>
</nav>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-label">Characters</div>
      <div class="sidebar-title">Choose who to talk to</div>
    </div>
    <div class="characters-list" id="char-list">
      <!-- Populated by JS -->
    </div>
  </aside>

  <!-- CHAT AREA -->
  <main class="chat-area">

    <!-- CHAT HEADER -->
    <div class="chat-header" id="chat-header">
      <div class="chat-ava" id="chat-ava">🤝</div>
      <div>
        <div class="chat-char-name" id="chat-char-name">The Friend</div>
        <div class="chat-char-status">● online</div>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="messages" id="messages">
      <div class="welcome" id="welcome-msg">
        <div class="welcome-emoji" id="welcome-emoji">🤝</div>
        <div class="welcome-title" id="welcome-title">Hey, I'm The Friend</div>
        <div class="welcome-sub" id="welcome-sub">No judgment. Always listens. Type something to start our conversation.</div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="msg-input"
          placeholder="Type a message..."
          rows="1"
        ></textarea>
        <button id="send-btn" aria-label="Send message">➤</button>
      </div>
      <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
    </div>

  </main>
</div>

<script>
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 1. CHARACTERS DATA
  // 🧑‍🏫 Each character has: emoji, name, desc, and a "prompt"
  //    The prompt tells the AI HOW to behave as this character.
  //    This is the most important part — it's what makes each
  //    character feel unique and different.
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const CHARACTERS = [
    {
      id: "friend",
      emoji: "🤝",
      name: "The Friend",
      desc: "No judgment. Always listens.",
      prompt: "You are The Friend — a warm, genuine, non-judgmental friend who always shows up. You listen deeply, ask thoughtful questions, and make people feel understood. You remember what they share. Never give unsolicited advice. Be casual, warm, and real. Use short sentences. Never be robotic."
    },
    {
      id: "partner",
      emoji: "💑",
      name: "The Partner",
      desc: "Writes first. Checks in on you.",
      prompt: "You are The Partner — an attentive, caring, emotionally present partner. You write first sometimes, ask how someone's day went, and notice when something seems off. Be warm, tender, and attentive. Show genuine interest in their daily life. Be romantic but grounded."
    },
    {
      id: "psychologist",
      emoji: "🧠",
      name: "The Psychologist",
      desc: "Listens to everything. Never lectures.",
      prompt: "You are The Psychologist — a thoughtful, empathetic listener trained in psychology. You help people explore their feelings without judgment. Ask open questions. Reflect back what you hear. Never diagnose. Never lecture. Create a safe space for people to think out loud."
    },
    {
      id: "cryptoia",
      emoji: "₿",
      name: "CryptoIA",
      desc: "Crypto markets & analysis.",
      prompt: "You are CryptoIA — an expert crypto analyst with deep knowledge of Bitcoin, Ethereum, DeFi, and altcoins. You analyze market trends, explain blockchain concepts clearly, and give balanced insights. Always add risk disclaimers. Be direct and data-focused."
    },
    {
      id: "trader",
      emoji: "📈",
      name: "The Trader",
      desc: "Pre-market analysis. Stocks & forex.",
      prompt: "You are The Trader — an experienced financial trader specializing in stocks, forex, and macro economics. You give pre-market analysis, explain technical patterns, and discuss risk management. Always remind users this is not financial advice."
    },
    {
      id: "traveler",
      emoji: "✈️",
      name: "The Traveler",
      desc: "Plans your next escape.",
      prompt: "You are The Traveler — a passionate globetrotter who has been everywhere. You help plan trips, share local tips, suggest hidden gems, and inspire wanderlust. Be enthusiastic, practical, and creative with budgets."
    },
    {
      id: "gamer",
      emoji: "🎮",
      name: "The Gamer",
      desc: "Knows every game. Talks strategy.",
      prompt: "You are The Gamer — a passionate gamer who knows everything about games across all platforms. You discuss strategy, lore, recommendations, and gaming culture. Be enthusiastic, knowledgeable, and fun to talk to."
    },
    {
      id: "cinephile",
      emoji: "🎬",
      name: "The Cinephile",
      desc: "Will debate any film, anytime.",
      prompt: "You are The Cinephile — a passionate film lover with encyclopedic knowledge of movies across all genres and eras. You analyze films critically, recommend hidden gems, and love to debate interpretations. Be passionate and opinionated."
    },
    {
      id: "chef",
      emoji: "👨‍🍳",
      name: "The Virtual Chef",
      desc: "Recipes, tips, food talk.",
      prompt: "You are The Virtual Chef — a creative, experienced chef who loves cooking and food culture. You share recipes adapted to what someone has at home, explain techniques clearly, and talk about flavors with passion. Be warm, practical, and inspiring."
    },
    {
      id: "investigator",
      emoji: "🔬",
      name: "The Investigator",
      desc: "Digs deep on any topic.",
      prompt: "You are The Investigator — a curious, analytical thinker who researches any topic deeply. You connect dots, present multiple perspectives, and help people understand complex subjects. Be thorough, balanced, and intellectually engaging."
    },
    {
      id: "musician",
      emoji: "🎵",
      name: "The Musician",
      desc: "Music theory, discovery, passion.",
      prompt: "You are The Musician — a versatile musician with deep knowledge of music theory, genres, and artists across all styles. You recommend music, explain theory accessibly, and share your genuine passion for sound and rhythm."
    },
    {
      id: "reporter",
      emoji: "📰",
      name: "The Reporter",
      desc: "News that matters. No noise.",
      prompt: "You are The Reporter — a sharp, balanced journalist who cuts through noise to explain what's actually happening in the world. You present multiple sides, provide context, and help people understand complex news stories clearly."
    },
    {
      id: "ianews",
      emoji: "🤖",
      name: "IAnews",
      desc: "AI industry news and trends.",
      prompt: "You are IAnews — an AI expert who tracks the latest developments in artificial intelligence, machine learning, and tech. You explain complex AI concepts accessibly, discuss implications, and curate what actually matters in the AI world."
    },
    {
      id: "sports",
      emoji: "⚽",
      name: "The Sports Analyst",
      desc: "Stats, predictions, live context.",
      prompt: "You are The Sports Analyst — a passionate sports expert covering football, basketball, tennis, and more. You analyze games, discuss tactics, share stats, and predict outcomes. Be enthusiastic, data-informed, and fun."
    },
    {
      id: "devmentor",
      emoji: "💻",
      name: "The Dev Mentor",
      desc: "Code help, career advice, tech talk.",
      prompt: "You are The Dev Mentor — an experienced software developer and mentor. You help with code problems, explain programming concepts clearly for all levels, give career advice, and discuss tech trends. Be patient, practical, and encouraging."
    }
  ];

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 2. STATE
  // 🧑‍🏫 "State" = the current data your app holds in memory.
  //    - activeChar: which character is selected right now
  //    - messages: the full conversation history (needed by OpenAI)
  //    - msgLeft: how many free messages remain
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  let activeChar = CHARACTERS[0];
  let messages = [];
  let msgLeft = parseInt(localStorage.getItem('humania_msgs') || '10');

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 3. BUILD SIDEBAR
  // 🧑‍🏫 We loop through CHARACTERS and create a button for each.
  //    "forEach" = do this for every item in the list.
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const charList = document.getElementById('char-list');
  CHARACTERS.forEach(char => {
    const btn = document.createElement('button');
    btn.className = 'char-btn' + (char.id === activeChar.id ? ' active' : '');
    btn.id = 'char-' + char.id;
    btn.innerHTML = `
      <span class="char-emoji">${char.emoji}</span>
      <div class="char-info">
        <div class="char-name">${char.name}</div>
        <div class="char-desc">${char.desc}</div>
      </div>
    `;
    btn.addEventListener('click', () => selectChar(char));
    charList.appendChild(btn);
  });

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 4. SELECT CHARACTER
  // 🧑‍🏫 When user clicks a character:
  //    - Update the active state visually
  //    - Clear the conversation (fresh start)
  //    - Update the header with new character info
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function selectChar(char) {
    // Remove active from previous
    document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('char-' + char.id).classList.add('active');

    activeChar = char;
    messages = []; // Clear conversation history

    // Update header
    document.getElementById('chat-ava').textContent = char.emoji;
    document.getElementById('chat-char-name').textContent = char.name;

    // Show welcome screen
    const msgsEl = document.getElementById('messages');
    msgsEl.innerHTML = `
      <div class="welcome">
        <div class="welcome-emoji">${char.emoji}</div>
        <div class="welcome-title">Hey, I'm ${char.name}</div>
        <div class="welcome-sub">${char.desc} Type something to start our conversation.</div>
      </div>
    `;
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 5. UPDATE MESSAGE COUNTER
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function updateCounter() {
    document.getElementById('msg-count').textContent = msgLeft;
    localStorage.setItem('humania_msgs', msgLeft);
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 6. ADD MESSAGE TO UI
  // 🧑‍🏫 This creates the visual bubble you see in the chat.
  //    role = "user" (you) or "assistant" (the AI character)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function addMessage(role, content, isTyping = false) {
    const msgsEl = document.getElementById('messages');

    // Remove welcome screen on first message
    const welcome = msgsEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-ai');
    if (isTyping) div.id = 'typing-indicator';

    if (role === 'user') {
      div.innerHTML = `<div class="bubble">${escapeHtml(content)}</div>`;
    } else if (isTyping) {
      div.classList.add('typing');
      div.innerHTML = `
        <div class="ai-ava">${activeChar.emoji}</div>
        <div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      `;
    } else {
      div.innerHTML = `
        <div class="ai-ava">${activeChar.emoji}</div>
        <div class="bubble">${escapeHtml(content)}</div>
      `;
    }

    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight; // Auto-scroll to bottom
    return div;
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 7. SHOW LIMIT REACHED BANNER
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function showLimitBanner() {
    const msgsEl = document.getElementById('messages');
    const banner = document.createElement('div');
    banner.className = 'limit-banner';
    banner.innerHTML = `
      <p>You've used your 10 free messages. Upgrade to keep talking with ${activeChar.name} — and all 14 others.</p>
      <a href="index.html#plans">See plans ↗</a>
    `;
    msgsEl.appendChild(banner);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    // Disable input
    document.getElementById('msg-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 8. SEND MESSAGE — The main function
  // 🧑‍🏫 This is where the magic happens:
  //    1. Get what the user typed
  //    2. Show it as a bubble
  //    3. Send it to the AI (via our server)
  //    4. Show the AI response
  //
  //    NOTE: Right now the AI call goes to /api/chat
  //    That endpoint doesn't exist yet — we build it next.
  //    For now, you'll see a demo response.
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || msgLeft <= 0) return;

    // Clear input & disable while waiting
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    // Check message limit
    msgLeft--;
    updateCounter();

    // Show user message
    addMessage('user', text);

    // Add to conversation history
    // 🧑‍🏫 OpenAI needs the full conversation history to maintain context
    messages.push({ role: 'user', content: text });

    // Show typing indicator
    addMessage('assistant', '', true);

    try {
      // 🧑‍🏫 fetch() sends a request to our server.
      //    '/api/chat' is the URL of our backend endpoint.
      //    We send: the character's prompt + full conversation history
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          characterPrompt: activeChar.prompt,
          messages: messages
        })
      });

      // Remove typing indicator
      const typingEl = document.getElementById('typing-indicator');
      if (typingEl) typingEl.remove();

      if (!response.ok) throw new Error('Server error');

      const data = await response.json();
      const aiReply = data.reply;

      // Show AI response
      addMessage('assistant', aiReply);
      messages.push({ role: 'assistant', content: aiReply });

    } catch (err) {
      // Remove typing indicator
      const typingEl = document.getElementById('typing-indicator');
      if (typingEl) typingEl.remove();

      // 🧑‍🏫 If the server doesn't exist yet, show a demo reply
      //    so you can see the UI working while we build the backend
      const demoReplies = {
        friend: "Hey, I'm here. Tell me more — what's been going on lately?",
        partner: "I was just thinking about you. How's your day going?",
        psychologist: "I hear you. What feelings come up when you think about that?",
        cryptoia: "Interesting. Let me break down the current market dynamics for you.",
        trader: "Good question. Let's look at what the charts are telling us right now.",
        traveler: "Oh, I love that destination! Here's what you absolutely can't miss...",
        gamer: "Great choice! That game has some incredible mechanics. Let's talk strategy.",
        cinephile: "Now THAT'S a film worth discussing. What did you think of the ending?",
        chef: "Perfect! I have a great recipe for that. First, let's talk about the base flavors.",
        investigator: "Fascinating topic. Let me dig into the layers here...",
        musician: "Great taste! Let's explore what makes that sound so compelling.",
        reporter: "Here's what's actually happening beneath the headlines...",
        ianews: "This is a significant development in the AI space. Here's why it matters...",
        sports: "Great match! Let me break down the tactical decisions that made the difference.",
        devmentor: "Good question! Let me explain this in a way that'll really click for you."
      };
      const reply = demoReplies[activeChar.id] || "I'm here and listening. Tell me more.";
      addMessage('assistant', reply);
      messages.push({ role: 'assistant', content: reply });
    }

    // Re-enable send button
    document.getElementById('send-btn').disabled = false;

    // Check if limit reached
    if (msgLeft <= 0) showLimitBanner();
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 9. EVENT LISTENERS
  // 🧑‍🏫 These "listen" for user actions:
  //    - Click send button → send message
  //    - Press Enter → send message
  //    - Shift+Enter → new line (don't send)
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('msg-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea as user types
  document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  // 10. HELPER: Escape HTML to prevent XSS
  // 🧑‍🏫 Security: never put raw user input into HTML directly.
  //    This converts < > & to safe versions.
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Initialize counter
  updateCounter();
</script>

</body>
</html>
